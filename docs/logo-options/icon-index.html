<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elegant Icon Logo Options</title>
    <style>
      body {
        margin: 0;
        color: #111111;
        background: #f5f5f5;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 40px 24px;
      }

      h1 {
        margin: 0 0 24px;
        font-size: 24px;
        letter-spacing: 0;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 16px;
      }

      .option {
        display: grid;
        gap: 12px;
        justify-items: center;
        padding: 20px;
        border: 1px solid #d7d7d7;
        border-radius: 8px;
        background: #ffffff;
      }

      .option img {
        width: 96px;
        height: 96px;
      }

      .nav-sample {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #111111;
        font-weight: 800;
      }

      .nav-sample img {
        width: 34px;
        height: 34px;
      }

      strong {
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Elegant Icon Logo Options</h1>
      <div class="grid">
        <section class="option"><img src="./icon-mark-1.svg" alt="Pear" /><strong>Option 1 · Pear</strong><span class="nav-sample"><img src="./icon-mark-1.svg" alt="" />Multiapp</span></section>
        <section class="option"><img src="./icon-mark-2.svg" alt="Swan" /><strong>Option 2 · Swan</strong><span class="nav-sample"><img src="./icon-mark-2.svg" alt="" />Multiapp</span></section>
        <section class="option"><img src="./icon-mark-3.svg" alt="Fig" /><strong>Option 3 · Fig</strong><span class="nav-sample"><img src="./icon-mark-3.svg" alt="" />Multiapp</span></section>
        <section class="option"><img src="./icon-mark-4.svg" alt="Stag crest" /><strong>Option 4 · Stag</strong><span class="nav-sample"><img src="./icon-mark-4.svg" alt="" />Multiapp</span></section>
        <section class="option"><img src="./icon-mark-5.svg" alt="Heron" /><strong>Option 5 · Heron</strong><span class="nav-sample"><img src="./icon-mark-5.svg" alt="" />Multiapp</span></section>
      </div>
    </main>
  </body>
</html>
