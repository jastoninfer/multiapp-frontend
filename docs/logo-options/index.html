<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiapp Logo Options</title>
    <style>
      body {
        margin: 0;
        color: #17202a;
        background: #f4f7fb;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 40px 24px;
      }

      h1 {
        margin: 0 0 24px;
        font-size: 24px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 16px;
      }

      .option {
        display: grid;
        gap: 12px;
        justify-items: center;
        padding: 20px;
        border: 1px solid #d5deea;
        border-radius: 8px;
        background: #ffffff;
      }

      .option img {
        width: 96px;
        height: 96px;
      }

      .nav-sample {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #0f172a;
        font-weight: 800;
      }

      .nav-sample img {
        width: 34px;
        height: 34px;
      }

      strong {
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Multiapp Logo Options</h1>
      <div class="grid">
        <section class="option"><img src="./multiapp-logo-1.svg" alt="Option 1" /><strong>Option 1</strong><span class="nav-sample"><img src="./multiapp-logo-1.svg" alt="" />Multiapp</span></section>
        <section class="option"><img src="./multiapp-logo-2.svg" alt="Option 2" /><strong>Option 2</strong><span class="nav-sample"><img src="./multiapp-logo-2.svg" alt="" />Multiapp</span></section>
        <section class="option"><img src="./multiapp-logo-3.svg" alt="Option 3" /><strong>Option 3</strong><span class="nav-sample"><img src="./multiapp-logo-3.svg" alt="" />Multiapp</span></section>
        <section class="option"><img src="./multiapp-logo-4.svg" alt="Option 4" /><strong>Option 4</strong><span class="nav-sample"><img src="./multiapp-logo-4.svg" alt="" />Multiapp</span></section>
        <section class="option"><img src="./multiapp-logo-5.svg" alt="Option 5" /><strong>Option 5</strong><span class="nav-sample"><img src="./multiapp-logo-5.svg" alt="" />Multiapp</span></section>
      </div>
    </main>
  </body>
</html>
